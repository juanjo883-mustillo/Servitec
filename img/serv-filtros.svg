<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030f27"/>
      <stop offset="100%" style="stop-color:#1a1200"/>
    </linearGradient>
    <linearGradient id="oil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbe33"/>
      <stop offset="100%" style="stop-color:#c47a00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="30" y="38" font-family="Arial Black,Arial" font-weight="900" font-size="16" fill="#fdbe33">CAMBIO DE FILTROS Y LUBRICANTES</text>
  <text x="30" y="56" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Repuestos originales y alternativos de calidad certificada — Stock disponible</text>
  <line x1="30" y1="65" x2="570" y2="65" stroke="#fdbe33" stroke-width="1.5" opacity="0.4"/>

  <!-- FILTRO DE AIRE - left -->
  <g transform="translate(70,90)">
    <!-- housing top cap -->
    <ellipse cx="50" cy="15" rx="50" ry="12" fill="#1a3a6b" stroke="#fdbe33" stroke-width="2"/>
    <rect x="0" y="15" width="100" height="160" fill="#0a2050" stroke="#fdbe33" stroke-width="2"/>
    <ellipse cx="50" cy="175" rx="50" ry="12" fill="#1a3a6b" stroke="#fdbe33" stroke-width="2"/>
    <!-- filter element inside -->
    <ellipse cx="50" cy="20" rx="38" ry="8" fill="#fdbe33" opacity="0.3"/>
    <!-- filter pleats -->
    <line x1="20" y1="22" x2="20" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="28" y1="22" x2="28" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="36" y1="22" x2="36" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="44" y1="22" x2="44" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="52" y1="22" x2="52" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="60" y1="22" x2="60" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="68" y1="22" x2="68" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <line x1="76" y1="22" x2="76" y2="168" stroke="#fdbe33" stroke-width="1.5" opacity="0.5"/>
    <!-- inner cylinder -->
    <ellipse cx="50" cy="95" rx="22" ry="80" fill="#040d1e" stroke="#1a3a6b" stroke-width="1"/>
    <!-- top bolt -->
    <rect x="40" y="5" width="20" height="10" rx="3" fill="#fdbe33"/>
    <circle cx="50" cy="10" r="5" fill="#030f27"/>
    <!-- label -->
    <rect x="18" y="80" width="64" height="30" rx="3" fill="#fdbe33"/>
    <text x="50" y="94" font-family="Arial Black,Arial" font-weight="900" font-size="8" fill="#030f27" text-anchor="middle">FILTRO</text>
    <text x="50" y="105" font-family="Arial Black,Arial" font-weight="900" font-size="8" fill="#030f27" text-anchor="middle">DE AIRE</text>
  </g>
  <text x="120" y="285" font-family="Arial,sans-serif" font-size="10" fill="#fdbe33" text-anchor="middle">Filtro de Aire</text>
  <text x="120" y="298" font-family="Arial,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Reemplazar c/500h</text>

  <!-- FILTRO DE ACEITE - center-left -->
  <g transform="translate(210,100)">
    <ellipse cx="45" cy="12" rx="45" ry="10" fill="#8b0000" stroke="#fdbe33" stroke-width="2"/>
    <rect x="0" y="12" width="90" height="140" fill="#5a0000" stroke="#fdbe33" stroke-width="2"/>
    <ellipse cx="45" cy="152" rx="45" ry="10" fill="#8b0000" stroke="#fdbe33" stroke-width="2"/>
    <!-- oil filter spiral -->
    <ellipse cx="45" cy="82" rx="32" ry="70" fill="none" stroke="#fdbe33" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="45" cy="82" rx="20" ry="55" fill="none" stroke="#fdbe33" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="45" cy="82" rx="8" ry="40" fill="#040d1e" stroke="#fdbe33" stroke-width="1"/>
    <rect x="28" y="68" width="34" height="28" rx="3" fill="#fdbe33"/>
    <text x="45" y="80" font-family="Arial Black,Arial" font-weight="900" font-size="7" fill="#030f27" text-anchor="middle">FILTRO</text>
    <text x="45" y="90" font-family="Arial Black,Arial" font-weight="900" font-size="7" fill="#030f27" text-anchor="middle">ACEITE</text>
    <!-- thread bottom -->
    <rect x="30" y="148" width="30" height="12" rx="3" fill="#aaa"/>
    <text x="45" y="157" font-family="Arial,sans-serif" font-size="6" fill="#030f27" text-anchor="middle">ROSCA</text>
  </g>
  <text x="255" y="268" font-family="Arial,sans-serif" font-size="10" fill="#fdbe33" text-anchor="middle">Filtro de Aceite</text>
  <text x="255" y="281" font-family="Arial,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Reemplazar c/2000h</text>

  <!-- SEPARADOR DE ACEITE - center -->
  <g transform="translate(345,85)">
    <ellipse cx="50" cy="14" rx="50" ry="12" fill="#1a3a6b" stroke="#4a8aff" stroke-width="2"/>
    <rect x="0" y="14" width="100" height="175" fill="#0a1840" stroke="#4a8aff" stroke-width="2"/>
    <ellipse cx="50" cy="189" rx="50" ry="12" fill="#1a3a6b" stroke="#4a8aff" stroke-width="2"/>
    <!-- inner tube -->
    <rect x="35" y="20" width="30" height="165" rx="5" fill="#040d1e" stroke="#4a8aff" stroke-width="1.5"/>
    <!-- separator media -->
    <ellipse cx="50" cy="80" rx="25" ry="8" fill="#4a8aff" opacity="0.4"/>
    <ellipse cx="50" cy="110" rx="25" ry="8" fill="#4a8aff" opacity="0.3"/>
    <ellipse cx="50" cy="140" rx="25" ry="8" fill="#4a8aff" opacity="0.4"/>
    <!-- label -->
    <rect x="12" y="96" width="76" height="28" rx="3" fill="#4a8aff" opacity="0.2" stroke="#4a8aff" stroke-width="1"/>
    <text x="50" y="108" font-family="Arial Black,Arial" font-weight="900" font-size="7" fill="#4a8aff" text-anchor="middle">SEPARADOR</text>
    <text x="50" y="118" font-family="Arial Black,Arial" font-weight="900" font-size="7" fill="#4a8aff" text-anchor="middle">ACEITE/AIRE</text>
    <!-- top bolt -->
    <circle cx="50" cy="8" r="8" fill="#fdbe33"/>
    <circle cx="50" cy="8" r="4" fill="#030f27"/>
  </g>
  <text x="395" y="288" font-family="Arial,sans-serif" font-size="10" fill="#4a8aff" text-anchor="middle">Separador</text>
  <text x="395" y="301" font-family="Arial,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Reemplazar c/4000h</text>

  <!-- OIL CAN - right -->
  <g transform="translate(490,110)">
    <!-- can body -->
    <rect x="0" y="40" width="80" height="120" rx="8" fill="url(#oil)" stroke="#c47a00" stroke-width="2"/>
    <!-- can top -->
    <rect x="10" y="20" width="60" height="25" rx="5" fill="#c47a00"/>
    <!-- spout -->
    <rect x="55" y="10" width="12" height="30" rx="3" fill="#c47a00" transform="rotate(30, 61, 25)"/>
    <!-- label -->
    <rect x="8" y="80" width="64" height="50" rx="3" fill="#030f27" fill-opacity="0.6"/>
    <text x="40" y="100" font-family="Arial Black,Arial" font-weight="900" font-size="9" fill="#fdbe33" text-anchor="middle">ACEITE</text>
    <text x="40" y="112" font-family="Arial,sans-serif" font-size="7" fill="#fff" text-anchor="middle">COMPRESOR</text>
    <text x="40" y="122" font-family="Arial,sans-serif" font-size="7" fill="#fff" text-anchor="middle">VDL 100</text>
    <!-- oil drops -->
    <ellipse cx="64" cy="175" rx="5" ry="8" fill="#fdbe33" opacity="0.8"/>
    <ellipse cx="58" cy="190" rx="4" ry="7" fill="#fdbe33" opacity="0.6"/>
    <ellipse cx="68" cy="188" rx="3" ry="5" fill="#fdbe33" opacity="0.5"/>
  </g>
  <text x="530" y="318" font-family="Arial,sans-serif" font-size="10" fill="#fdbe33" text-anchor="middle">Lubricante VDL</text>
  <text x="530" y="331" font-family="Arial,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Cambio c/2000h</text>

  <!-- NEW badge overlay on each -->
  <rect x="80" y="90" width="36" height="18" rx="9" fill="#00cc66"/>
  <text x="98" y="103" font-family="Arial Black,Arial" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">NUEVO</text>
  <rect x="216" y="100" width="36" height="18" rx="9" fill="#00cc66"/>
  <text x="234" y="113" font-family="Arial Black,Arial" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">NUEVO</text>
  <rect x="351" y="85" width="36" height="18" rx="9" fill="#00cc66"/>
  <text x="369" y="98" font-family="Arial Black,Arial" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">NUEVO</text>

  <!-- bottom info bar -->
  <rect x="30" y="335" width="540" height="50" rx="8" fill="#0a1830" stroke="#1a3a6b" stroke-width="1"/>
  <text x="300" y="354" font-family="Arial Black,Arial" font-weight="900" font-size="10" fill="#fdbe33" text-anchor="middle">STOCK PERMANENTE — ENTREGA INMEDIATA EN TODA BUENOS AIRES</text>
  <text x="300" y="372" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">Repuestos originales y alternativos de calidad · Kaeser · Sullair · Atlas Copco · Ingersoll Rand · Quincy</text>
</svg>
