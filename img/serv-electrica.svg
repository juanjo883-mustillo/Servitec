<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030f27"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  <!-- scan lines effect -->
  <rect width="600" height="400" fill="url(#bg5)" opacity="0.5"/>

  <!-- Title -->
  <text x="30" y="38" font-family="Arial Black,Arial" font-weight="900" font-size="16" fill="#fdbe33">REVISIÓN ELÉCTRICA Y TABLEROS DE CONTROL</text>
  <text x="30" y="56" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Sensores · Electroválvulas · Variadores de frecuencia · Tableros de mando</text>
  <line x1="30" y1="65" x2="570" y2="65" stroke="#fdbe33" stroke-width="1.5" opacity="0.4"/>

  <!-- MAIN CONTROL PANEL -->
  <rect x="30" y="80" width="280" height="240" rx="8" fill="#040d1e" stroke="#fdbe33" stroke-width="3"/>
  <rect x="30" y="80" width="280" height="35" rx="8" fill="#fdbe33"/>
  <rect x="30" y="103" width="280" height="12" fill="#fdbe33"/>
  <text x="170" y="101" font-family="Arial Black,Arial" font-weight="900" font-size="12" fill="#030f27" text-anchor="middle">TABLERO DE CONTROL</text>

  <!-- DISPLAY screen -->
  <rect x="50" y="126" width="240" height="90" rx="5" fill="#000814" stroke="#00cc66" stroke-width="2"/>
  <!-- screen glow -->
  <rect x="50" y="126" width="240" height="90" rx="5" fill="#00cc66" fill-opacity="0.04"/>
  <!-- screen content -->
  <text x="75" y="147" font-family="Courier New,monospace" font-size="9" fill="#00cc66">COMPRESOR SK-25 — SERVITEC</text>
  <line x1="55" y1="153" x2="285" y2="153" stroke="#00cc66" stroke-width="0.8" opacity="0.4"/>
  <text x="55" y="165" font-family="Courier New,monospace" font-size="9" fill="#00cc66">PRESION:    <tspan fill="#fdbe33">8.2 bar</tspan>  ✔ OK</text>
  <text x="55" y="178" font-family="Courier New,monospace" font-size="9" fill="#00cc66">TEMP:       <tspan fill="#fdbe33">72°C  </tspan>  ✔ OK</text>
  <text x="55" y="191" font-family="Courier New,monospace" font-size="9" fill="#00cc66">CAUDAL:     <tspan fill="#fdbe33">2.3 m³/m</tspan> ✔ OK</text>
  <text x="55" y="204" font-family="Courier New,monospace" font-size="9" fill="#cc3300">SENSOR T2:  <tspan fill="#ff4444">FALLA  </tspan>  ✖ ERR</text>
  <!-- blinking cursor -->
  <rect x="55" y="207" width="8" height="2" fill="#00cc66" opacity="0.8"/>

  <!-- SWITCHES ROW -->
  <text x="50" y="238" font-family="Arial,sans-serif" font-size="9" fill="#aaa">CIRCUITOS</text>
  <!-- switch 1 ON -->
  <rect x="50" y="243" width="36" height="18" rx="9" fill="#00cc66"/>
  <circle cx="80" cy="252" r="7" fill="#fff"/>
  <text x="68" y="270" font-family="Arial,sans-serif" font-size="8" fill="#00cc66" text-anchor="middle">ON</text>
  <!-- switch 2 ON -->
  <rect x="96" y="243" width="36" height="18" rx="9" fill="#00cc66"/>
  <circle cx="126" cy="252" r="7" fill="#fff"/>
  <text x="114" y="270" font-family="Arial,sans-serif" font-size="8" fill="#00cc66" text-anchor="middle">ON</text>
  <!-- switch 3 OFF -->
  <rect x="142" y="243" width="36" height="18" rx="9" fill="#555"/>
  <circle cx="150" cy="252" r="7" fill="#fff"/>
  <text x="160" y="270" font-family="Arial,sans-serif" font-size="8" fill="#888" text-anchor="middle">OFF</text>
  <!-- switch 4 ON -->
  <rect x="188" y="243" width="36" height="18" rx="9" fill="#00cc66"/>
  <circle cx="218" cy="252" r="7" fill="#fff"/>
  <text x="206" y="270" font-family="Arial,sans-serif" font-size="8" fill="#00cc66" text-anchor="middle">ON</text>
  <!-- fault light -->
  <circle cx="248" cy="252" r="12" fill="#cc3300"/>
  <circle cx="248" cy="252" r="8" fill="#ff4444"/>
  <text x="248" y="270" font-family="Arial,sans-serif" font-size="7" fill="#cc3300" text-anchor="middle">FAULT</text>

  <!-- CIRCUIT BREAKERS -->
  <text x="50" y="295" font-family="Arial,sans-serif" font-size="9" fill="#aaa">DISYUNTORES</text>
  <rect x="50" y="300" width="22" height="45" rx="3" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <rect x="56" y="305" width="10" height="20" rx="2" fill="#fdbe33"/>
  <rect x="80" y="300" width="22" height="45" rx="3" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <rect x="86" y="310" width="10" height="20" rx="2" fill="#fdbe33"/>
  <rect x="110" y="300" width="22" height="45" rx="3" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <rect x="116" y="308" width="10" height="20" rx="2" fill="#fdbe33"/>
  <rect x="140" y="300" width="22" height="45" rx="3" fill="#8b0000" stroke="#cc3300" stroke-width="1"/>
  <rect x="146" y="302" width="10" height="20" rx="2" fill="#ff4444"/>
  <text x="151" y="354" font-family="Arial,sans-serif" font-size="7" fill="#cc3300" text-anchor="middle">TRIP</text>
  <rect x="170" y="300" width="22" height="45" rx="3" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <rect x="176" y="306" width="10" height="20" rx="2" fill="#fdbe33"/>
  <rect x="200" y="300" width="22" height="45" rx="3" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <rect x="206" y="312" width="10" height="20" rx="2" fill="#fdbe33"/>

  <!-- MULTIMETER right-top -->
  <rect x="340" y="80" width="110" height="160" rx="8" fill="#0a1830" stroke="#fdbe33" stroke-width="2"/>
  <text x="395" y="100" font-family="Arial Black,Arial" font-weight="900" font-size="10" fill="#fdbe33" text-anchor="middle">MULTÍMETRO</text>
  <rect x="355" y="108" width="80" height="50" rx="4" fill="#000814" stroke="#00cc66" stroke-width="1.5"/>
  <text x="395" y="128" font-family="Courier New,monospace" font-size="8" fill="#00cc66" text-anchor="middle">AC VOLTAGE</text>
  <text x="395" y="148" font-family="Courier New,monospace" font-size="18" fill="#00cc66" font-weight="900" text-anchor="middle">380 V</text>
  <!-- selector dial -->
  <circle cx="395" cy="190" r="28" fill="#040d1e" stroke="#fdbe33" stroke-width="2"/>
  <circle cx="395" cy="190" r="20" fill="#1a3a6b"/>
  <line x1="395" y1="190" x2="395" y2="172" stroke="#fdbe33" stroke-width="3" stroke-linecap="round"/>
  <!-- dial labels -->
  <text x="395" y="166" font-family="Arial,sans-serif" font-size="7" fill="#fdbe33" text-anchor="middle">V~</text>
  <text x="416" y="193" font-family="Arial,sans-serif" font-size="7" fill="#aaa">Ω</text>
  <text x="374" y="193" font-family="Arial,sans-serif" font-size="7" fill="#aaa">A</text>
  <!-- probes -->
  <line x1="380" y1="230" x2="360" y2="290" stroke="#cc3300" stroke-width="3" stroke-linecap="round"/>
  <line x1="410" y1="230" x2="430" y2="290" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="360" cy="292" r="5" fill="#cc3300"/>
  <circle cx="430" cy="292" r="5" fill="#333"/>

  <!-- WIRING DIAGRAM -->
  <rect x="340" y="255" width="240" height="105" rx="8" fill="#040d1e" stroke="#1a3a6b" stroke-width="1.5"/>
  <text x="460" y="273" font-family="Arial Black,Arial" font-weight="900" font-size="10" fill="#fdbe33" text-anchor="middle">DIAGRAMA ELÉCTRICO</text>
  <!-- simplified circuit -->
  <rect x="355" y="280" width="20" height="14" rx="2" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1"/>
  <text x="365" y="291" font-family="Arial,sans-serif" font-size="7" fill="#fdbe33" text-anchor="middle">M</text>
  <line x1="375" y1="287" x2="415" y2="287" stroke="#fdbe33" stroke-width="1.5"/>
  <rect x="415" y="280" width="20" height="14" rx="2" fill="#1a3a6b" stroke="#4a8aff" stroke-width="1"/>
  <text x="425" y="291" font-family="Arial,sans-serif" font-size="7" fill="#4a8aff" text-anchor="middle">C</text>
  <line x1="435" y1="287" x2="475" y2="287" stroke="#4a8aff" stroke-width="1.5"/>
  <rect x="475" y="280" width="20" height="14" rx="2" fill="#cc3300" stroke="#ff4444" stroke-width="1"/>
  <text x="485" y="291" font-family="Arial,sans-serif" font-size="7" fill="#ff4444" text-anchor="middle">T2</text>
  <text x="485" y="306" font-family="Arial,sans-serif" font-size="7" fill="#cc3300" text-anchor="middle">FALLA</text>
  <line x1="475" y1="287" x2="455" y2="310" stroke="#cc3300" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- ground lines -->
  <line x1="365" y1="294" x2="365" y2="320" stroke="#fdbe33" stroke-width="1.5"/>
  <line x1="350" y1="320" x2="380" y2="320" stroke="#fdbe33" stroke-width="2"/>
  <line x1="355" y1="325" x2="375" y2="325" stroke="#fdbe33" stroke-width="1.5"/>
  <line x1="360" y1="330" x2="370" y2="330" stroke="#fdbe33" stroke-width="1"/>
  <!-- volt indication -->
  <text x="530" y="300" font-family="Courier New,monospace" font-size="12" fill="#00cc66" font-weight="900">380V</text>
  <text x="530" y="315" font-family="Courier New,monospace" font-size="12" fill="#00cc66" font-weight="900">50Hz</text>
  <text x="530" y="330" font-family="Courier New,monospace" font-size="12" fill="#fdbe33" font-weight="900">15kW</text>

  <!-- status row bottom -->
  <rect x="30" y="340" width="540" height="48" rx="8" fill="#0a1830" stroke="#1a3a6b" stroke-width="1"/>
  <text x="300" y="358" font-family="Arial Black,Arial" font-weight="900" font-size="10" fill="#fdbe33" text-anchor="middle">INSPECCIÓN COMPLETA — SENSORES · ELECTROVÁLVULAS · VARIADORES · TABLEROS</text>
  <text x="300" y="376" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">Técnicos certificados con instrumental calibrado · Reporte de diagnóstico incluido</text>
</svg>
