<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030f27"/>
      <stop offset="100%" style="stop-color:#051a3e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="120" y1="0" x2="120" y2="400" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="240" y1="0" x2="240" y2="400" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="360" y1="0" x2="360" y2="400" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
  <line x1="480" y1="0" x2="480" y2="400" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>

  <!-- Compressor body -->
  <rect x="80" y="130" width="260" height="160" rx="10" fill="#0a2050" stroke="#fdbe33" stroke-width="2.5"/>
  <!-- Compressor top panel -->
  <rect x="80" y="130" width="260" height="40" rx="10" fill="#fdbe33"/>
  <rect x="80" y="155" width="260" height="15" fill="#fdbe33"/>
  <!-- Label on top -->
  <text x="210" y="156" font-family="Arial Black,Arial" font-weight="900" font-size="13" fill="#030f27" text-anchor="middle">COMPRESOR A TORNILLO</text>
  <!-- Compressor vents -->
  <rect x="100" y="185" width="18" height="85" rx="3" fill="#051a3e" stroke="#2a4a8a" stroke-width="1"/>
  <rect x="125" y="185" width="18" height="85" rx="3" fill="#051a3e" stroke="#2a4a8a" stroke-width="1"/>
  <rect x="150" y="185" width="18" height="85" rx="3" fill="#051a3e" stroke="#2a4a8a" stroke-width="1"/>
  <!-- Display panel -->
  <rect x="185" y="185" width="120" height="85" rx="5" fill="#040d1e" stroke="#fdbe33" stroke-width="1.5"/>
  <text x="245" y="210" font-family="Arial,sans-serif" font-size="10" fill="#fdbe33" text-anchor="middle">ESTADO DEL EQUIPO</text>
  <!-- Green OK indicator -->
  <circle cx="215" cy="232" r="8" fill="#00cc66"/>
  <text x="232" y="236" font-family="Arial,sans-serif" font-size="10" fill="#00cc66">OPERATIVO</text>
  <!-- Gauge -->
  <circle cx="245" cy="255" r="12" fill="none" stroke="#fdbe33" stroke-width="1.5"/>
  <line x1="245" y1="255" x2="254" y2="247" stroke="#fdbe33" stroke-width="2"/>
  <text x="245" y="270" font-family="Arial,sans-serif" font-size="8" fill="#aaa" text-anchor="middle">8 bar</text>

  <!-- Pipe top -->
  <rect x="200" y="100" width="20" height="30" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1.5"/>
  <!-- Air outlet pipe right -->
  <rect x="340" y="175" width="50" height="20" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1.5"/>
  <!-- Pipe elbow -->
  <rect x="385" y="155" width="20" height="40" fill="#1a3a6b" stroke="#fdbe33" stroke-width="1.5"/>
  <!-- Motor on right -->
  <ellipse cx="405" cy="210" rx="18" ry="30" fill="#0d2040" stroke="#fdbe33" stroke-width="1.5"/>
  <!-- Base feet -->
  <rect x="90" y="290" width="30" height="12" rx="3" fill="#fdbe33"/>
  <rect x="290" y="290" width="30" height="12" rx="3" fill="#fdbe33"/>

  <!-- CALENDAR - top right -->
  <rect x="430" y="100" width="110" height="100" rx="8" fill="#0a2050" stroke="#fdbe33" stroke-width="2"/>
  <rect x="430" y="100" width="110" height="28" rx="8" fill="#fdbe33"/>
  <rect x="430" y="118" width="110" height="10" fill="#fdbe33"/>
  <text x="485" y="120" font-family="Arial Black,Arial" font-weight="900" font-size="11" fill="#030f27" text-anchor="middle">MANTENIMIENTO</text>
  <!-- Calendar rings -->
  <line x1="456" y1="100" x2="456" y2="92" stroke="#fdbe33" stroke-width="3" stroke-linecap="round"/>
  <line x1="514" y1="100" x2="514" y2="92" stroke="#fdbe33" stroke-width="3" stroke-linecap="round"/>
  <!-- Calendar grid -->
  <text x="448" y="148" font-family="Arial,sans-serif" font-size="9" fill="#aaa">L  M  X  J  V</text>
  <!-- Checkmarks on calendar days -->
  <text x="445" y="165" font-family="Arial,sans-serif" font-size="9" fill="#00cc66">✓  ✓  ✓  ✓  ✓</text>
  <text x="445" y="180" font-family="Arial,sans-serif" font-size="9" fill="#fdbe33">✓  ✓  ✓</text>
  <text x="480" y="180" font-family="Arial,sans-serif" font-size="9" fill="#555">○  ○</text>
  <text x="445" y="195" font-family="Arial,sans-serif" font-size="9" fill="#555">○  ○  ○  ○  ○</text>

  <!-- WRENCH -->
  <g transform="translate(430,220) rotate(-45)">
    <rect x="-6" y="-50" width="12" height="80" rx="4" fill="#2a4a8a" stroke="#fdbe33" stroke-width="1.5"/>
    <circle cx="0" cy="-50" r="14" fill="none" stroke="#fdbe33" stroke-width="3"/>
    <circle cx="0" cy="-50" r="6" fill="#fdbe33"/>
    <rect x="-4" y="30" width="8" height="18" rx="3" fill="#fdbe33"/>
  </g>

  <!-- Checklist items -->
  <rect x="80" y="315" width="440" height="68" rx="8" fill="#0a1830" stroke="#1a3a6b" stroke-width="1"/>
  <text x="100" y="335" font-family="Arial,sans-serif" font-size="11" fill="#fdbe33">✔ Cambio de aceite y filtros</text>
  <text x="100" y="352" font-family="Arial,sans-serif" font-size="11" fill="#fdbe33">✔ Revisión de correas y rodamientos</text>
  <text x="310" y="335" font-family="Arial,sans-serif" font-size="11" fill="#fdbe33">✔ Control de presión y temperatura</text>
  <text x="310" y="352" font-family="Arial,sans-serif" font-size="11" fill="#fdbe33">✔ Limpieza de refrigeradores</text>
  <text x="100" y="372" font-family="Arial,sans-serif" font-size="10" fill="#666">Próximo servicio programado — cada 500 hs de trabajo</text>

  <!-- Title bottom -->
  <rect x="0" y="388" width="600" height="12" fill="#fdbe33" opacity="0.15"/>
</svg>
